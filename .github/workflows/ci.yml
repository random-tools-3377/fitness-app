name: CI

# Runs on every push. Releases come only from pushes to main.
#
# There is deliberately no pull_request or pull_request_target trigger: code from pull requests
# never runs here. The signing secrets are read only by the "sign" job, which runs no build
# code: it signs and checks an APK that the "build" job made without any secrets.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

# A push to a branch cancels that branch's earlier run. Each push to main runs on its own, so a
# release never waits behind an earlier run's slow iPhone job; the release script skips a
# version that is already out, or older than one that is.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The release certificate. Every release must be signed with it, or Android refuses to
  # install the update over the app already on the phone.
  RELEASE_CERT_SHA256: "10:BE:7D:71:15:4D:4D:85:CB:67:82:46:4A:5A:97:B5:F4:56:C2:3B:64:E9:59:6A:B9:81:B5:75:3D:B1:0E:74"

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests (the shared rules, on the JVM)
        run: ./gradlew --no-daemon :core:jvmTest :app:testDebugUnitTest

      - name: Build the release APK, unsigned
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Check the database layout is committed
        run: scripts/check-schema.sh

      - name: Check there is no network permission (before signing)
        run: scripts/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Keep the unsigned APK for the sign job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            core/build/reports
            app/build/reports
          if-no-files-found: ignore
          retention-days: 7

  emulator:
    name: Emulator test (log a food, see the day's total)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its test
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run the test on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Show why the emulator tests failed
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -name 'TEST-*.xml' \
            -exec sed -n '/<failure/,/<\/failure>/p' {} + | head -n 600

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 7

  iphone:
    name: Shared code on iPhone (simulator tests)
    # Keeps the shared code ready for the iPhone app. It doesn't hold back Android releases.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Pick an Xcode the Kotlin compiler supports
        run: |
          ls -d /Applications/Xcode*.app || true
          xcode="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Shared tests on an iPhone simulator
        run: ./gradlew --no-daemon :core:iosSimulatorArm64Test

      - name: Check the iPhone tests really ran
        run: |
          results=$(ls core/build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null | wc -l | tr -d ' ')
          tests=$(cat core/build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "Test files: $results, tests: ${tests:-0}"
          if [ "${tests:-0}" -lt 1 ]; then echo "::error::No iPhone tests ran."; exit 1; fi

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-reports
          path: core/build/reports
          if-no-files-found: ignore
          retention-days: 7

  sign:
    name: Sign and check the release APK
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Only this repository's scripts are used here; no build code runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: dist

      - name: Sign with the release key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: scripts/sign-apk.sh dist/app-release-unsigned.apk dist/fitness.apk

      - name: Check the signature is the release certificate
        run: scripts/check-signature.sh dist/fitness.apk "$RELEASE_CERT_SHA256"

      - name: Check there is no network permission
        run: scripts/check-permissions.sh dist/fitness.apk

      - name: Check phone backup is off
        run: scripts/check-backup.sh dist/fitness.apk

      - name: Keep the signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: dist/fitness.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the Release
    needs: [sign, emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: dist

      - name: Check once more before publishing
        run: |
          scripts/check-signature.sh dist/fitness.apk "$RELEASE_CERT_SHA256"
          scripts/check-permissions.sh dist/fitness.apk
          scripts/check-backup.sh dist/fitness.apk

      - name: Publish the signed APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh dist/fitness.apk
