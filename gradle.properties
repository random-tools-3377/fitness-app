org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# iPhone targets only build on a Mac (CI has one). Elsewhere they are skipped quietly.
kotlin.native.ignoreDisabledTargets=true

# The version the owner sees. A push to main whose version has no Release yet becomes a new
# Release, using the notes in release-notes/<version>.md.
appVersionName=0.14.0
